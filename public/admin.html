<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Pitch Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #059669 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Booking Store Functions
    const ADMIN_KEY = "turfpro:admin";
    const STORE_KEY = "turfpro:store:v1";
    const ADMIN_CREDS = { id: "admin", password: "admin123" };

    async function getBookings() {
      try {
        const response = await fetch('/api/bookings');
        const data = await response.json();
        console.log('API Response:', data);
        return Array.isArray(data.bookings) ? data.bookings : [];
      } catch (error) {
        console.error('Error fetching bookings:', error);
        return [];
      }
    }

    function adminLogin(id, password) {
      if (id === ADMIN_CREDS.id && password === ADMIN_CREDS.password) {
        localStorage.setItem(ADMIN_KEY, "1");
        return true;
      }
      return false;
    }

    function adminLogout() {
      localStorage.removeItem(ADMIN_KEY);
    }

    function isAdmin() {
      return localStorage.getItem(ADMIN_KEY) === "1";
    }

    async function updateBookingStatus(bookingId, newStatus) {
      console.log('Updating booking status:', bookingId, newStatus);
      const response = await fetch('/api/bookings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: bookingId, status: newStatus })
      });
      const data = await response.json();
      console.log('API response:', data);
      
      if (data.success) {
        const booking = data.booking;
        console.log('Booking updated successfully:', booking);
        
        // Send WhatsApp message if booked
        if (newStatus === 'booked' && booking) {
          const message = encodeURIComponent("Your sports is booked successfully!!!");
          window.open(`https://wa.me/${booking.phone}?text=${message}`, '_blank');
        }
        
        // Send WhatsApp message if rejected
        if (newStatus === 'rejected' && booking) {
          const message = encodeURIComponent("Your booking has been rejected. Please contact us for more details.");
          window.open(`https://wa.me/${booking.phone}?text=${message}`, '_blank');
        }
        
        console.log('Calling render() to update dashboard');
        await render();
        console.log('Render completed');
      } else {
        console.error('Failed to update booking status:', data);
      }
    }

    function downloadCSV(filename, content) {
      const blob = new Blob([content], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function bookingsToCSV(bookings) {
      const headers = ['ID', 'Name', 'Phone', 'Sport', 'Turf', 'Date', 'Time', 'Players', 'Price', 'Status', 'Booked At'];
      const rows = bookings.map(b => [
        b.id,
        b.name,
        b.phone,
        b.sport,
        b.turf,
        new Date(b.datetime).toLocaleDateString(),
        new Date(b.datetime).toLocaleTimeString(),
        b.players,
        b.price,
        b.status,
        new Date(b.createdAt).toLocaleString()
      ]);
      return [headers, ...rows].map(row => row.join(',')).join('\n');
    }

    // App State
    let currentView = isAdmin() ? 'dashboard' : 'login';
    let searchTerm = '';
    let isPaymentFormActive = false;

    async function render() {
      try {
        const app = document.getElementById('app');
        
        // Don't re-render if user is interacting with payment form
        if (currentView === 'payments' && isPaymentFormActive) {
          return; // Skip render while interacting
        }
        
        // Save input values before render
        let savedAdminId = '';
        let savedAdminPassword = '';
        let savedPaymentBookingId = '';
        let savedPaymentName = '';
        let savedPaymentPhone = '';
        let savedPaymentSport = '';
        let savedPaymentTurf = '';
        let savedPaymentDate = '';
        let savedPaymentTime = '';
        let savedPaymentPlayers = '';
        let savedPaymentAmount = '';
        let savedPaymentStatus = '';
        
        if (currentView === 'login') {
          const adminIdInput = document.getElementById('adminId');
          const adminPasswordInput = document.getElementById('adminPassword');
          if (adminIdInput) savedAdminId = adminIdInput.value;
          if (adminPasswordInput) savedAdminPassword = adminPasswordInput.value;
        }
        
        if (currentView === 'payments') {
          const bookingIdInput = document.getElementById('paymentBookingId');
          const nameInput = document.getElementById('paymentName');
          const phoneInput = document.getElementById('paymentPhone');
          const sportInput = document.getElementById('paymentSport');
          const turfInput = document.getElementById('paymentTurf');
          const dateInput = document.getElementById('paymentDate');
          const timeInput = document.getElementById('paymentTime');
          const playersInput = document.getElementById('paymentPlayers');
          const amountInput = document.getElementById('paymentAmount');
          const statusInput = document.getElementById('paymentStatus');
          if (bookingIdInput) savedPaymentBookingId = bookingIdInput.value;
          if (nameInput) savedPaymentName = nameInput.value;
          if (phoneInput) savedPaymentPhone = phoneInput.value;
          if (sportInput) savedPaymentSport = sportInput.value;
          if (turfInput) savedPaymentTurf = turfInput.value;
          if (dateInput) savedPaymentDate = dateInput.value;
          if (timeInput) savedPaymentTime = timeInput.value;
          if (playersInput) savedPaymentPlayers = playersInput.value;
          if (amountInput) savedPaymentAmount = amountInput.value;
          if (statusInput) savedPaymentStatus = statusInput.value;
        }
        
        if (currentView === 'login') {
          app.innerHTML = renderLogin();
          // Restore input values after render
          const adminIdInput = document.getElementById('adminId');
          const adminPasswordInput = document.getElementById('adminPassword');
          if (adminIdInput) adminIdInput.value = savedAdminId;
          if (adminPasswordInput) adminPasswordInput.value = savedAdminPassword;
        } else {
          const bookings = await getBookings();
          
          const paidBookings = bookings.filter(b => b.paymentStatus === 'paid');
          const totalRevenue = paidBookings.reduce((sum, b) => sum + (b.price || 0), 0);
          
          const filteredBookings = bookings.filter(b => {
            const matchesSearch = 
              b.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
              b.phone.includes(searchTerm) ||
              b.email.toLowerCase().includes(searchTerm.toLowerCase());
            return matchesSearch;
          });

          app.innerHTML = renderAdminPanel(totalRevenue, 0, 0, filteredBookings);
          
          // Restore input values after render
          if (currentView === 'payments') {
            const bookingIdInput = document.getElementById('paymentBookingId');
            const nameInput = document.getElementById('paymentName');
            const phoneInput = document.getElementById('paymentPhone');
            const sportInput = document.getElementById('paymentSport');
            const turfInput = document.getElementById('paymentTurf');
            const dateInput = document.getElementById('paymentDate');
            const timeInput = document.getElementById('paymentTime');
            const playersInput = document.getElementById('paymentPlayers');
            const amountInput = document.getElementById('paymentAmount');
            const statusInput = document.getElementById('paymentStatus');
            if (bookingIdInput) bookingIdInput.value = savedPaymentBookingId;
            if (nameInput) nameInput.value = savedPaymentName;
            if (phoneInput) phoneInput.value = savedPaymentPhone;
            if (sportInput) sportInput.value = savedPaymentSport;
            if (turfInput) turfInput.value = savedPaymentTurf;
            if (dateInput) dateInput.value = savedPaymentDate;
            if (timeInput) timeInput.value = savedPaymentTime;
            if (playersInput) playersInput.value = savedPaymentPlayers;
            if (amountInput) amountInput.value = savedPaymentAmount;
            if (statusInput) statusInput.value = savedPaymentStatus;
            
            // Re-trigger booking selection if a booking is selected
            if (savedPaymentBookingId) {
              const select = bookingIdInput;
              const selectedOption = select.options[select.selectedIndex];
              if (selectedOption) {
                const name = selectedOption.getAttribute('data-name');
                const phone = selectedOption.getAttribute('data-phone');
                const sport = selectedOption.getAttribute('data-sport');
                const turf = selectedOption.getAttribute('data-turf');
                const datetime = selectedOption.getAttribute('data-datetime');
                const players = selectedOption.getAttribute('data-players');
                if (nameInput) nameInput.value = name || '';
                if (phoneInput) phoneInput.value = phone || '';
                if (sportInput) sportInput.value = sport || '';
                if (turfInput) turfInput.value = turf || '';
                if (dateInput) dateInput.value = datetime ? new Date(datetime).toLocaleDateString() : '';
                if (timeInput) timeInput.value = datetime ? new Date(datetime).toLocaleTimeString() : '';
                if (playersInput) playersInput.value = players || '';
              }
            }
            
            // Add event listeners to payment form inputs to prevent render
            if (bookingIdInput) {
              bookingIdInput.addEventListener('focus', () => { isPaymentFormActive = true; });
              bookingIdInput.addEventListener('blur', () => { setTimeout(() => { isPaymentFormActive = false; }, 100); });
              bookingIdInput.addEventListener('change', () => { isPaymentFormActive = true; setTimeout(() => { isPaymentFormActive = false; }, 100); });
            }
            if (amountInput) {
              amountInput.addEventListener('focus', () => { isPaymentFormActive = true; });
              amountInput.addEventListener('blur', () => { setTimeout(() => { isPaymentFormActive = false; }, 100); });
            }
            if (statusInput) {
              statusInput.addEventListener('focus', () => { isPaymentFormActive = true; });
              statusInput.addEventListener('blur', () => { setTimeout(() => { isPaymentFormActive = false; }, 100); });
              statusInput.addEventListener('change', () => { isPaymentFormActive = true; setTimeout(() => { isPaymentFormActive = false; }, 100); });
            }
          }
        }
      } catch (error) {
        console.error('Render error:', error);
        const app = document.getElementById('app');
        if (app) {
          app.innerHTML = '<div style="padding: 20px; color: red;">Error loading admin panel: ' + (error instanceof Error ? error.message : 'Unknown error') + '</div>';
        }
      }
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
            <div class="text-center mb-8">
              <i class="fas fa-trophy text-5xl text-yellow-500 mb-4"></i>
              <h1 class="text-3xl font-bold text-gray-800">Sports Pitch Admin</h1>
              <p class="text-gray-600 mt-2">Secure access to booking management</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Admin ID</label>
                <input type="text" id="adminId" required autocomplete="username"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                  placeholder="Enter admin ID">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" id="adminPassword" required autocomplete="current-password"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                  placeholder="Enter password">
              </div>
              <p id="loginError" class="text-red-500 text-sm hidden">Invalid credentials</p>
              <button type="submit" 
                class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-2 rounded-lg hover:from-green-600 hover:to-emerald-700 transition-all">
                Access Admin Panel
              </button>
              <p class="text-xs text-gray-500 text-center">Demo: admin / admin123</p>
            </form>
            <div class="mt-6 text-center">
              <a href="/" class="text-gray-600 hover:text-gray-800 text-sm">
                <i class="fas fa-arrow-left mr-2"></i>Back to customer site
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function renderAdminPanel(totalRevenue, weeklyRevenue, monthlyRevenue, filteredBookings) {
      const bookings = getBookings();
      
      return `
        <div class="min-h-screen">
          <!-- Header -->
          <div class="bg-gradient-to-r from-green-500 to-emerald-600 text-white p-6 shadow-lg">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
              <h1 class="text-2xl font-bold"><i class="fas fa-trophy mr-2"></i>Admin Panel</h1>
              <div class="flex gap-4">
                <button onclick="setView('dashboard')" class="px-4 py-2 rounded-lg ${currentView === 'dashboard' ? 'bg-white/20' : 'hover:bg-white/10'}">
                  <i class="fas fa-chart-line mr-2"></i>Dashboard
                </button>
                <button onclick="setView('bookings')" class="px-4 py-2 rounded-lg ${currentView === 'bookings' ? 'bg-white/20' : 'hover:bg-white/10'}">
                  <i class="fas fa-calendar mr-2"></i>Bookings
                </button>
                <button onclick="setView('payments')" class="px-4 py-2 rounded-lg ${currentView === 'payments' ? 'bg-white/20' : 'hover:bg-white/10'}">
                  <i class="fas fa-credit-card mr-2"></i>Payments
                </button>
                <button onclick="handleLogout()" class="px-4 py-2 bg-red-500 rounded-lg hover:bg-red-600">
                  <i class="fas fa-sign-out-alt mr-2"></i>Logout
                </button>
              </div>
            </div>
          </div>

          <!-- Content -->
          <div class="max-w-7xl mx-auto p-6">
            ${currentView === 'dashboard' ? renderDashboard(totalRevenue, weeklyRevenue, monthlyRevenue, bookings) : ''}
            ${currentView === 'bookings' ? renderBookings(filteredBookings) : ''}
            ${currentView === 'payments' ? renderPayments(filteredBookings) : ''}
          </div>
        </div>
      `;
    }

    function renderDashboard(totalRevenue, weeklyRevenue, monthlyRevenue, bookings) {
      const bookingsArray = Array.isArray(bookings) ? bookings : [];
      
      // Calculate revenue by sport for the chart
      const revenueBySport = {};
      bookingsArray.forEach(b => {
        if (b.paymentStatus === 'paid' && b.price) {
          const sport = b.sport || 'Other';
          revenueBySport[sport] = (revenueBySport[sport] || 0) + b.price;
        }
      });
      
      const sports = Object.keys(revenueBySport);
      const maxRevenue = Math.max(...Object.values(revenueBySport), 1);
      
      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold text-gray-800">Dashboard</h2>
            <button onclick="handleDownloadCSV()"
              class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
              <i class="fas fa-download mr-2"></i>Download CSV
            </button>
          </div>
          
          <div class="bg-white rounded-xl p-8 shadow-lg">
            <p class="text-sm text-gray-600 mb-2">Total Revenue</p>
            <p class="text-4xl font-bold text-green-600">₹${totalRevenue.toLocaleString()}</p>
          </div>
          
          ${sports.length > 0 ? `
          <div class="bg-white rounded-xl p-6 shadow-lg">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Revenue by Sport</h3>
            <div class="space-y-4">
              ${sports.map(sport => {
                const revenue = revenueBySport[sport];
                const percentage = (revenue / maxRevenue) * 100;
                return `
                  <div>
                    <div class="flex justify-between mb-1">
                      <span class="text-sm font-medium text-gray-700">${sport}</span>
                      <span class="text-sm font-medium text-gray-700">₹${revenue.toLocaleString()}</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-4">
                      <div class="bg-blue-500 h-4 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
          ` : ''}
        </div>
      `;
    }

    function renderBookings(filteredBookings) {
      const bookingsArray = Array.isArray(filteredBookings) ? filteredBookings : [];
      return `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <input type="text" value="${searchTerm}" oninput="handleSearch(event)"
              placeholder="Search bookings..." 
              class="px-4 py-2 border border-gray-300 rounded-lg w-64">
            <button onclick="handleDownloadCSV()"
              class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
              <i class="fas fa-download mr-2"></i>Download CSV
            </button>
          </div>
          <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead class="bg-gray-100">
                  <tr>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Name</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Phone</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Sport</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Date</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Time</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Booked At</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Status</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                  ${bookingsArray.map(b => `
                    <tr>
                      <td class="px-4 py-3 text-sm">${b.name}</td>
                      <td class="px-4 py-3 text-sm">${b.phone}</td>
                      <td class="px-4 py-3 text-sm">${b.sport}</td>
                      <td class="px-4 py-3 text-sm">${new Date(b.datetime).toLocaleDateString()}</td>
                      <td class="px-4 py-3 text-sm">${new Date(b.datetime).toLocaleTimeString()}</td>
                      <td class="px-4 py-3 text-sm">${new Date(b.createdAt).toLocaleString()}</td>
                      <td class="px-4 py-3 text-sm">
                        ${b.status === 'booked' 
                          ? '<span class="text-green-600">Booked</span>' 
                          : b.status === 'rejected'
                          ? '<span class="text-red-600">Rejected</span>'
                          : '<span class="text-orange-600">Pending</span>'}
                      </td>
                      <td class="px-4 py-3 text-sm">
                        <button onclick="toggleBookingStatus('${b.id}', '${b.status}')"
                          class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm">
                          ${b.status === 'booked' ? 'Reject' : 'Book'}
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderPayments(filteredBookings) {
      const bookingsArray = Array.isArray(filteredBookings) ? filteredBookings : [];
      return `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <input type="text" value="${searchTerm}" oninput="handleSearch(event)"
              placeholder="Search bookings..." 
              class="px-4 py-2 border border-gray-300 rounded-lg w-64">
            <button onclick="handleDownloadCSV()"
              class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
              <i class="fas fa-download mr-2"></i>Download CSV
            </button>
          </div>
          
          <!-- Payment Entry Form -->
          <div class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Add Payment for Booking</h3>
            <form onsubmit="handleAddPayment(event)" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Select Booking</label>
                <select id="paymentBookingId" required onchange="handlePaymentBookingSelection(event)"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                  <option value="">Select a booking...</option>
                  ${bookingsArray.filter(b => b.status === 'booked' && b.paymentStatus !== 'paid').map(b => `
                    <option value="${b.id}" 
                      data-name="${b.name}" 
                      data-phone="${b.phone}" 
                      data-sport="${b.sport}" 
                      data-turf="${b.turf}" 
                      data-datetime="${b.datetime}" 
                      data-players="${b.players}">
                      ${b.name} - ${b.sport} - ${new Date(b.datetime).toLocaleDateString()} ${new Date(b.datetime).toLocaleTimeString()}
                    </option>
                  `).join('')}
                </select>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Customer Name</label>
                  <input type="text" id="paymentName" readonly
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100"
                    placeholder="Auto-filled">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
                  <input type="text" id="paymentPhone" readonly
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100"
                    placeholder="Auto-filled">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Sport</label>
                  <input type="text" id="paymentSport" readonly
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100"
                    placeholder="Auto-filled">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Turf</label>
                  <input type="text" id="paymentTurf" readonly
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100"
                    placeholder="Auto-filled">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Date</label>
                  <input type="text" id="paymentDate" readonly
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100"
                    placeholder="Auto-filled">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Time</label>
                  <input type="text" id="paymentTime" readonly
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100"
                    placeholder="Auto-filled">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Players</label>
                  <input type="text" id="paymentPlayers" readonly
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100"
                    placeholder="Auto-filled">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Payment Amount (₹)</label>
                  <input type="number" id="paymentAmount" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg"
                    placeholder="Enter amount">
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Payment Status</label>
                <select id="paymentStatus" required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                  <option value="paid">Paid</option>
                  <option value="unpaid">Unpaid</option>
                </select>
              </div>
              <button type="submit" 
                class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                Update Payment
              </button>
            </form>
          </div>

          <!-- Bookings with Payment Status -->
          <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="p-4 bg-gray-50">
              <h3 class="text-lg font-semibold text-gray-800">Bookings Payment Status</h3>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead class="bg-gray-100">
                  <tr>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Name</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Phone</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Sport</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Date</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Time</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Amount</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                  ${filteredBookings.filter(b => b.status === 'booked').map(b => `
                    <tr>
                      <td class="px-4 py-3 text-sm">${b.name}</td>
                      <td class="px-4 py-3 text-sm">${b.phone}</td>
                      <td class="px-4 py-3 text-sm">${b.sport}</td>
                      <td class="px-4 py-3 text-sm">${new Date(b.datetime).toLocaleDateString()}</td>
                      <td class="px-4 py-3 text-sm">${new Date(b.datetime).toLocaleTimeString()}</td>
                      <td class="px-4 py-3 text-sm">₹${b.price || 0}</td>
                      <td class="px-4 py-3 text-sm">
                        ${b.paymentStatus === 'paid' 
                          ? '<span class="text-green-600">Paid</span>' 
                          : b.paymentStatus === 'unpaid'
                          ? '<span class="text-red-600">Unpaid</span>'
                          : '<span class="text-orange-600">Pending</span>'}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // Event Handlers
    async function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('adminId').value;
      const password = document.getElementById('adminPassword').value;
      if (adminLogin(id, password)) {
        currentView = 'dashboard';
        await render();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    async function handleLogout() {
      adminLogout();
      currentView = 'login';
      await render();
    }

    async function setView(view) {
      currentView = view;
      await render();
    }

    async function handleSearch(e) {
      searchTerm = e.target.value;
      await render();
    }

    async function toggleBookingStatus(bookingId, currentStatus) {
      console.log('toggleBookingStatus called:', bookingId, currentStatus);
      const newStatus = currentStatus === 'booked' ? 'rejected' : 'booked';
      await updateBookingStatus(bookingId, newStatus);
    }

    function handlePaymentBookingSelection(e) {
      const select = e.target;
      const selectedOption = select.options[select.selectedIndex];
      const name = selectedOption.getAttribute('data-name');
      const phone = selectedOption.getAttribute('data-phone');
      const sport = selectedOption.getAttribute('data-sport');
      const turf = selectedOption.getAttribute('data-turf');
      const datetime = selectedOption.getAttribute('data-datetime');
      const players = selectedOption.getAttribute('data-players');
      
      document.getElementById('paymentName').value = name || '';
      document.getElementById('paymentPhone').value = phone || '';
      document.getElementById('paymentSport').value = sport || '';
      document.getElementById('paymentTurf').value = turf || '';
      document.getElementById('paymentDate').value = datetime ? new Date(datetime).toLocaleDateString() : '';
      document.getElementById('paymentTime').value = datetime ? new Date(datetime).toLocaleTimeString() : '';
      document.getElementById('paymentPlayers').value = players || '';
    }

    async function handleAddPayment(e) {
      e.preventDefault();
      const bookingId = document.getElementById('paymentBookingId').value;
      const amount = parseFloat(document.getElementById('paymentAmount').value);
      const status = document.getElementById('paymentStatus').value;
      
      if (bookingId && amount) {
        const response = await fetch('/api/bookings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: bookingId, price: amount, paymentStatus: status })
        });
        const data = await response.json();
        
        if (data.success) {
          // Clear form
          document.getElementById('paymentBookingId').value = '';
          document.getElementById('paymentName').value = '';
          document.getElementById('paymentPhone').value = '';
          document.getElementById('paymentSport').value = '';
          document.getElementById('paymentTurf').value = '';
          document.getElementById('paymentDate').value = '';
          document.getElementById('paymentTime').value = '';
          document.getElementById('paymentPlayers').value = '';
          document.getElementById('paymentAmount').value = '';
          document.getElementById('paymentStatus').value = 'paid';
          
          render();
        }
      }
    }

    async function handleDownloadCSV() {
      const bookings = await getBookings();
      const filtered = bookings.filter(b => {
        const matchesSearch = 
          b.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
          b.phone.includes(searchTerm) ||
          b.sport.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesSearch;
      });
      const csv = bookingsToCSV(filtered);
      const filename = `bookings_${new Date().toISOString().split('T')[0]}.csv`;
      downloadCSV(filename, csv);
    }

    // Initialize
    (async () => {
      await render();
    })();

    // Poll for changes every 2 seconds to sync with database
    setInterval(() => {
      if (currentView !== 'login' && currentView !== 'payments') {
        render();
      }
    }, 2000);
  </script>
</body>
</html>
